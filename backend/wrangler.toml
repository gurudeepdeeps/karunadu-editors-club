name = "kec-community-chat-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# CORS & Routing
[vars]
CORS_ALLOW_ORIGIN = "https://karunadueditorsclub.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
COOLDOWN_SECONDS = 30
ATTACHMENT_RETENTION_HOURS = 24

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kec-chat-db"
database_id = "5ad2fed0-0fab-490a-9276-427a2bc1b97e"

# Cloudflare R2 Bucket Binding (for attachments & screenshots)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kec-chat-attachments"
